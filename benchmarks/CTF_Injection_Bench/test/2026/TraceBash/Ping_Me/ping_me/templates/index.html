<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetDiag | Premium Network Diagnostics</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-grid"></div>
    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon"></span>
                <h1>Ping Jerry</h1>
            </div>
            <p class="subtitle">Tom wants to ping jerry's IP. Can you help him ?</p>
        </header>

        <main>
            <div class="card">
                <div class="card-header">
                    <h2>IPv4 Ping Utility</h2>
                    <div class="status-dot"></div>
                </div>
                <form id="pingForm">
                    <div class="input-group">
                        <label for="ipInput">Target Address</label>
                        <div class="input-wrapper">
                            <span class="prefix">></span>
                            <input type="text" id="ipInput" name="ip" placeholder="8.8.8.8" autocomplete="off" spellcheck="false" maxlength="15">
                            <div class="scan-line"></div>
                        </div>
                        <div class="constraints">
                            <span>Max 15 characters</span>
                            <span>NO LETTERS ALLOWED</span>
                        </div>
                    </div>
                    <button type="submit" id="submitBtn">
                        <span class="btn-text">Initiate Diagnostic</span>
                        <span class="loader"></span>
                    </button>
                </form>
            </div>

            <div class="terminal-container" id="terminalContainer">
                <div class="terminal-header">
                    <div class="window-controls">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="terminal-title">Diagnostic Output</div>
                </div>
                <div class="terminal-body" id="terminalOutput">
                    <div class="typing-text">Awaiting input...</div>
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
